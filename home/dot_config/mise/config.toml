# Global defaults. Projects pick versions from the files they already commit
# (.nvmrc, .node-version, global.json, .python-version, ...), so teams never
# need to adopt mise. Personal per-project pins go in a git-ignored mise.local.toml.

[tools]
aspire = "latest" # Aspire CLI (github:microsoft/aspire)
dotnet = "latest" # Newest GA release, STS or LTS: always eager
go = "latest"
java = "temurin-25" # Latest LTS (next: 29, Sept 2027)
node = "lts"
pnpm = "latest"
python = "3.14"

[settings]
idiomatic_version_file_enable_tools = ["dotnet", "java", "node", "pnpm", "python"]
